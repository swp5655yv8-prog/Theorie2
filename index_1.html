function build(weak){
  let f=[];
  S.forEach(q=>sel.has(q.t)&&kind!='ear'&&f.push({t:q.t,id:q.id,mk:()=>Q(q.t,q.id,q.q,q.r,q.w,q.why)}));
  G.forEach(([t,fn,e],i)=>sel.has(t)&&(kind=='all'||(kind=='ear')==!!e)&&[0,1,2].forEach(()=>f.push({t,id:'g'+i,mk:fn})));
  const w=x=>weak?(1+5*(1-((st.t[x.t]?.ok||0)+1)/((st.t[x.t]?.n||0)+2)))*(1+2*(st.q[x.id]||0)):1;
  const out=[];
  while(out.length<cnt&&f.length){let r=Math.random()*f.reduce((s,x)=>s+w(x),0),i=0;for(;i<f.length-1;i++){r-=w(f[i]);if(r<=0)break}out.push(f.splice(i,1)[0].mk())}
  return out}

function start(weak){ses={weak,qs:build(weak),i:0,log:[],done:false};if(!ses.qs.length){alert('Geen vragen voor deze keuze. Kies een onderwerp of een andere soort.');return}quiz()}
function quiz(){
  const q=ses.qs[ses.i],L=ses.log;
  $.innerHTML=`<div class="prog">${ses.qs.map((_,i)=>`<i class="${i<L.length?(L[i].ok?'d':'x'):i==ses.i?'n':''}"></i>`).join('')}</div>
  <div class="box"><span class="tag">${T[q.t][1]} ${T[q.t][0]} · vraag ${ses.i+1} van ${ses.qs.length}</span><p class="q">${q.q}</p>${q.snd?'<p><button class="p" data-a="snd">🎧 Beluister (opnieuw)</button></p>':''}
  <div id="opts">${q.o.map((o,i)=>`<button class="o" data-o="${i}">${o}</button>`).join('')}</div><div id="fb"></div></div>`;if(q.snd)setTimeout(q.snd,250)}
function answer(i){
  const q=ses.qs[ses.i];if(ses.done)return;ses.done=true;const ok=i==q.a;
  ses.log.push({t:q.t,ok});
  const s=st.t[q.t]=st.t[q.t]||{n:0,ok:0};s.n++;if(ok)s.ok++;
  st.q[q.id]=Math.max(0,(st.q[q.id]||0)+(ok?-1:1));save();
  document.querySelectorAll('.o').forEach((b,j)=>{b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==i)b.classList.add('no')});
  const last=ses.i==ses.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Juist!':'Niet juist.'}</b> ${ok?'':'Het juiste antwoord is: <b>'+q.o[q.a]+'</b>. '}${q.why||''}</div><div class="row"><button class="p" data-a="next" id="nx">${last?'Bekijk resultaat':'Volgende vraag'}</button></div>`;
  document.getElementById('nx').focus()}
function next(){stop();ses.done=false;ses.i++;ses.i>=ses.qs.length?result():quiz()}
function result(){
  const L=ses.log,ok=L.filter(x=>x.ok).length,by={};
  L.forEach(x=>{(by[x.t]=by[x.t]||{n:0,ok:0}).n++;if(x.ok)by[x.t].ok++});
  const p=Math.round(100*ok/L.length);
  $.innerHTML=`<div class="box"><p class="score">${ok} / ${L.length}</p><p>${p>=80?'Sterk gedaan! Dit zit er goed in.':p>=50?'Goed bezig. Met nog wat oefening zit je er.':'Dit mag nog groeien. Probeer "Train mijn zwaktes" om gericht te herhalen.'}</p>
  <h2>Per onderwerp</h2>${Object.entries(by).map(([t,s])=>`<div class="rt"><span>${T[t][1]} ${T[t][0]}</span><div class="bar"><span style="width:${100*s.ok/s.n}%"></span></div><b>${s.ok}/${s.n}</b></div>`).join('')}
  <div class="row"><button class="p" data-a="again">Nog een ronde</button><button class="w" data-a="weak">Train mijn zwaktes</button><button data-a="home">Ander onderwerp kiezen</button></div></div>`}

$.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.o!==undefined)return answer(+b.dataset.o);
  if(b.dataset.k){kind=b.dataset.k;return home()}
  if(b.dataset.n){cnt=+b.dataset.n;return home()}
  const a=b.dataset.a;
  if(a=='all'){sel=new Set(Object.keys(T));home()}
  else if(a=='none'){sel=new Set();home()}
  else if(a=='go')start(false);
  else if(a=='weak')start(true);
  else if(a=='again')start(ses.weak);
  else if(a=='next')next();
  else if(a=='lab')lab();
  else if(a=='lsc')go(sc(labRoot,MI[+b.dataset.i]),labRoot)();
  else if(a=='lch')go(ch(labRoot,MC[+b.dataset.i]),labRoot)();
  else if(a=='snd')ses.qs[ses.i].snd();
